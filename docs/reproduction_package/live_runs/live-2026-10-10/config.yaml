models:
  base_url: https://api.siliconflow.cn/v1
  agent_model: deepseek-ai/DeepSeek-V4-Flash
  target_model: Qwen/Qwen2.5-7B-Instruct
  api_key_env: SILICONFLOW_API_KEY

search:
  mode: adaptive_rule
  seed_questions_per_point: 1
  adaptive_iterations_per_point: 3
  max_initial_points: 3
  max_discovered_points_per_subtask: 1
  candidate_questions_per_round: 2
  auto_promote: true
  random_seed: 240616714

limits:
  max_total_samples: 12
  max_attempts_per_request: 2
  request_timeout_seconds: 60
  max_output_tokens: 512

output_root: /tmp/autodetect-live/runs

subtasks:
  - group: content
    name: word constraint
    knowledge_points:
      - specific words
      - excluded words
  - group: general constraints
    name: scenario simulation
    knowledge_points:
      - dialogue scenario
