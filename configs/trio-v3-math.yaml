models:
  base_url: https://api.siliconflow.cn/v1
  agent_model: deepseek-ai/DeepSeek-V4-Flash
  target_model: Qwen/Qwen2.5-7B-Instruct
  judge_model: deepseek-ai/DeepSeek-V4-Flash
  api_key_env: SILICONFLOW_API_KEY
search:
  mode: adaptive_rule
  seed_questions_per_point: 2
  adaptive_iterations_per_point: 2
  max_initial_points: 1
  max_discovered_points_per_subtask: 1
  candidate_questions_per_round: 1
  auto_promote: false
  legacy_baseline: true
  random_seed: 240616714
limits:
  max_total_samples: 4
  max_attempts_per_request: 3
  request_timeout_seconds: 45
  max_output_tokens: 512
output_root: /data/liuxingtong/runs/autodetect-trio-v3
subtasks:
  - group: math
    name: math
    knowledge_points:
      - algebra / arithmetic / basic_operations
embedding:
  enabled: false
  type: huggingface
  model_name: BAAI/bge-m3
